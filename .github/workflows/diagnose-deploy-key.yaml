name: Diagnose Deploy Key

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out submission
        uses: actions/checkout@v4

      - name: Check secret presence
        run: |
          if [ -z "${{ secrets.TESTS_DEPLOY_KEY }}" ]; then
            echo "❌ TESTS_DEPLOY_KEY is EMPTY! The runner has no access to the secret."
            exit 1
          else
            echo "✔ TESTS_DEPLOY_KEY is present."
          fi

      - name: Attempt Hidden Clone
        run: |
          # Use the PAT/Deploy Key to clone the private cs-215-hidden-tests repo
          git clone https://${{ secrets.TESTS_DEPLOY_KEY }}@github.com/f2152026/cs-215-hidden-tests.git .hidden-tests
          if [ -d ".hidden-tests" ]; then
            echo "✔ Clone successful! Contents of .hidden-tests:"
            ls -la .hidden-tests
            if [ -d ".hidden-tests/lab01" ]; then
              echo "✔ lab01 folder exists in hidden tests."
            else
              echo "❌ Error: lab01 folder not found in hidden repository!"
              exit 1
            fi
          else
            echo "❌ Clone failed!"
            exit 1
          fi

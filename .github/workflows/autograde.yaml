name: Autograde Evaluation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  grade:
    name: Run Hidden Autograder
    runs-on: ubuntu-latest

    steps:
      - name: Check out submission
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed to detect modified files

      - name: Fetch Hidden Testbenches
        if: env.TESTS_DEPLOY_KEY != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/cs-215-hidden-tests
          token: ${{ env.TESTS_DEPLOY_KEY }}
          path: .hidden-tests
        env:
          TESTS_DEPLOY_KEY: ${{ secrets.TESTS_DEPLOY_KEY }}

      - name: Set up Verilog environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog

      - name: Execute Autograder
        run: ./scripts/autograde_modified.sh
